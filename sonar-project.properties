sonar.organization=arumannn
sonar.projectKey=arumannn_fe-tracer-study
sonar.sources=.
sonar.exclusions=node_modules/**,dist/**,build/**,e2e/**,coverage/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# File test & config tooling tidak perlu dituntut coverage sendiri --
# tetap dianalisis untuk bug/code smell, cuma dikeluarkan dari syarat %coverage.
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,src/test/**,playwright.config.ts,vite.config.ts,tailwind.config.ts,eslint.config.js
